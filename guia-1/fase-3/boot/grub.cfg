# grub.cfg - Menú de GRUB para la Fase 3
# GRUB carga el kernel ELF con el protocolo Multiboot2 y la imagen IMG1 como
# módulo; el kernel recibe la dirección del módulo en las etiquetas Multiboot2.

insmod all_video                # controladores VBE/VGA para el framebuffer
set timeout=5
set default=0

menuentry "Micro S.O. Fase 3 - kernel C + imagen grafica (800x600x32)" {
    multiboot2 /boot/kernel_f3.elf
    module2    /boot/imagen.img imagen
    boot
}

menuentry "Prueba 1: modulo de imagen corrupto (truncado)" {
    multiboot2 /boot/kernel_f3.elf
    module2    /boot/imagen_corrupta.img imagen
    boot
}

# El comando multiboot2 fija gfxpayload según la etiqueta de framebuffer del
# kernel, por eso "text" se asigna después: GRUB entrega entonces modo texto.
menuentry "Prueba 2: sin modo grafico (gfxpayload=text)" {
    multiboot2 /boot/kernel_f3.elf
    module2    /boot/imagen.img imagen
    set gfxpayload=text
    boot
}
